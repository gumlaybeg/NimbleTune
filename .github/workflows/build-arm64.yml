name: Build arm64 Release APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build arm64 Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true # Ensures binary .aar files are pulled if using Git LFS

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build arm64 Release APK
        run: ./gradlew :app:assembleArm64Release --stacktrace

      - name: Sign APK
        run: |
          APK_DIR="app/build/outputs/apk/arm64/release"
          APK_FILE=$(find "$APK_DIR" -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found in $APK_DIR"
            exit 1
          fi

          echo "Found APK: $APK_FILE"

          # Locate the latest apksigner binary available in the Android SDK
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Signing with repository secret keystore..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            
            "$APKSIGNER" sign \
              --ks release.keystore \
              --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
              --out "${APK_DIR}/SimpleTune-arm64-release-signed.apk" \
              "$APK_FILE"
          else
            echo "No keystore secret configured. Self-signing with a debug key..."
            keytool -genkey -v -keystore test.keystore -alias test -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=AndroidDebug,O=Android,C=US"
            
            "$APKSIGNER" sign \
              --ks test.keystore \
              --ks-pass pass:android \
              --ks-key-alias test \
              --key-pass pass:android \
              --out "${APK_DIR}/SimpleTune-arm64-release-signed.apk" \
              "$APK_FILE"
          fi

      - name: Upload arm64 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleTune-arm64-release
          path: app/build/outputs/apk/arm64/release/*signed.apk
          if-no-files-found: error
          retention-days: 14
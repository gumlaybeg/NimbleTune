name: Build arm64 Release APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        lfs: true

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21' # Changed from 17 to 21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make Gradle wrapper executable
      run: chmod +x gradlew

    - name: Build arm64 Release APK
      run: ./gradlew :app:assembleArm64Release --stacktrace

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: arm64-release-apk
        path: app/build/outputs/apk/arm64/release/*.apk